<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OPEN{% endblock title %}</title>
</head>
<body style="margin: 0; padding: 24px 16px; background-color: #ffffff; color: #1a1a1a; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5;">
<div style="max-width: 560px; margin: 0 auto;">
<p style="margin: 0 0 24px; font-size: 20px; font-weight: bold;">OPEN</p>
{% block content %}{% endblock content %}
<hr style="border: none; border-top: 1px solid #dddddd; margin: 32px 0 16px;">
<p style="margin: 0 0 8px; font-size: 13px; color: #555555;">{% block reason %}{% endblock reason %}</p>
<p style="margin: 0; font-size: 13px; color: #555555;">This is an automated message from OPEN, the Open Pickleball Evaluation Network.</p>
</div>
</body>
</html>
